[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persistent-research-agent"
version = "0.1.0"
description = "A low-cost, persistent, tool-using research agent for any OpenAI-compatible LLM, with pluggable data sources."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Beichen-Dai", email = "181300868+Beichen-Dai@users.noreply.github.com" }]
keywords = ["llm", "agent", "research", "deepseek", "rag", "scientific-computing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "openai>=1.30",
    "pypdf>=4.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
research-agent = "research_agent.cli:main"

[project.urls]
Homepage = "https://github.com/Beichen-Dai/persistent-research-agent"
Documentation = "https://github.com/Beichen-Dai/persistent-research-agent/tree/main/docs"
Issues = "https://github.com/Beichen-Dai/persistent-research-agent/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_agent = ["data/*.toml", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM105"]
